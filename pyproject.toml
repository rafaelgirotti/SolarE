[project]
name = "solare"
version = "0.1.0"
description = "Solar-aware, crash-resumable video re-encoding orchestrator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.60",
    "psutil>=6.0",
]

[project.optional-dependencies]
solar = ["growattServer"]
gpu = ["nvidia-ml-py"]

[project.scripts]
solare = "solare.tui.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solare"]
